<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Yoghesh R V — Software Engineering, Cloud and AI Systems</title>
  <desc id="desc">A restrained navy and cyan JARVIS-inspired heads-up display with a technical targeting reticle and system indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset=".55" stop-color="#0b1e31"/>
      <stop offset="1" stop-color="#08283b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b7897" stop-opacity="0"/>
      <stop offset=".48" stop-color="#25d7ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#0b7897" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#42e7ff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#0b8bab" stop-opacity=".12"/>
      <stop offset="1" stop-color="#07111d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="10" fill="url(#grid)"/>
  <ellipse cx="170" cy="130" rx="210" ry="170" fill="url(#core)"/>
  <path d="M18 54V18H54 M1146 18H1182V54 M18 206V242H54 M1146 242H1182V206" fill="none" stroke="#38d9ff" stroke-opacity=".8" stroke-width="2"/>
  <path d="M26 68H88 M1112 68H1174 M26 192H88 M1112 192H1174" stroke="#38d9ff" stroke-opacity=".22"/>

  <!-- Left-side technical reticle -->
  <g transform="translate(164 130)" fill="none" stroke="#48dfff">
    <circle r="83" stroke-opacity=".24" stroke-width="1"/>
    <circle r="68" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="2 7"/>
    <circle r="54" stroke-opacity=".48" stroke-width="1.2" stroke-dasharray="54 12 18 12"/>
    <circle r="33" stroke-opacity=".75" stroke-width="1.2"/>
    <path d="M-102 0H-76 M76 0H102 M0-102V-76 M0 76V102" stroke-width="1.5"/>
    <path d="M-14-14L-33-33 M14-14L33-33 M-14 14L-33 33 M14 14L33 33" stroke-opacity=".6"/>
    <circle r="10" fill="#32d9ff" fill-opacity=".2" stroke-width="1.6" filter="url(#softGlow)"/>
    <circle r="3" fill="#8cf0ff" stroke="none"/>
  </g>
  <g fill="#78e8ff" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.7">
    <text x="55" y="38">SYS / ONLINE</text>
    <text x="55" y="224">CORE INTERFACE</text>
    <text x="285" y="40">PROFILE ID: YRV-01</text>
  </g>

  <!-- Main identity -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="700" y="105" fill="#e7f7ff" font-size="54" font-weight="700" letter-spacing="3">YOGHESH R V</text>
    <path d="M430 124H970" stroke="url(#beam)" stroke-width="1.5"/>
    <text x="700" y="157" fill="#8dddf2" font-size="17" font-weight="600" letter-spacing="2.2">SOFTWARE ENGINEERING  /  CLOUD  /  AI SYSTEMS</text>
    <text x="700" y="194" fill="#71aabd" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2">BUILD  ·  ANALYZE  ·  AUTOMATE  ·  DEPLOY</text>
  </g>

  <!-- Right-side system readouts -->
  <g font-family="Consolas, 'Courier New', monospace" fill="#75dff7">
    <text x="1010" y="42" font-size="10" letter-spacing="1.5">J.A.R.V.I.S. / UI</text>
    <text x="1010" y="62" font-size="9" fill="#6197a9">INTERFACE MODE</text>
    <text x="1010" y="81" font-size="10" fill="#b9eefa">READY</text>
    <circle cx="1170" cy="38" r="3" fill="#45e3a4"/>
    <path d="M1010 98H1168" stroke="#38d9ff" stroke-opacity=".5"/>
    <text x="1010" y="120" font-size="9" fill="#6197a9">ACTIVE DOMAINS</text>
    <text x="1010" y="143" font-size="10">WEB / CLOUD</text>
    <text x="1010" y="162" font-size="10">DATA / AI</text>
    <text x="1010" y="181" font-size="10">SYSTEMS / IoT</text>
  </g>
  <path d="M300 226H900" stroke="#38d9ff" stroke-opacity=".28"/>
  <path d="M570 226H830" stroke="#38d9ff" stroke-opacity=".75" stroke-width="2"/>
  <circle cx="550" cy="226" r="2" fill="#7ceaff"/>
  <circle cx="850" cy="226" r="2" fill="#7ceaff"/>
</svg>